<!doctype html>
<!--
  Bhatkhande Flow playground.
  Paste or drop a bandish (JSON, swartaal XML or a Label Studio export) and see it rendered.

  Run it with `npm run web`. That builds bhatkhande-flow.js and copies fonts/ and examples/
  next to this page, then serves the folder (fetch() does not work from file://).

  Files:
    index.html       the page layout (this file)
    playground.css   the styles
    playground.js    what the page does
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bhatkhande Flow</title>
    <link rel="stylesheet" href="playground.css" />
  </head>

  <body>
    <header>
      <h1>Bhatkhande Flow</h1>
      <span>Bandish JSON, swartaal XML or a Label Studio export → Bhatkhande notation, in the browser</span>
    </header>

    <main>
      <!-- Left: input and options -->
      <section class="panel">
        <label for="example">Example</label>
        <select id="example"></select>

        <div class="drop" id="drop">
          Drop a .json / .xml file here, or
          <input type="file" id="file" accept=".json,.xml" />
        </div>

        <label for="src">Input (bandish JSON · XML · Label Studio JSON)</label>
        <textarea id="src" spellcheck="false"></textarea>

        <div class="row">
          <div>
            <label for="engine">Font engine</label>
            <select id="engine">
              <option value="fontkit">Outlines (same as Node)</option>
              <option value="canvas">Browser text (canvas)</option>
            </select>
          </div>
          <div>
            <label for="script">Script</label>
            <select id="script">
              <option value="devanagari">देवनागरी</option>
              <option value="latin">Latin (S R G M)</option>
            </select>
          </div>
        </div>

        <div class="checks">
          <label><input type="checkbox" id="lyricCurves" /> curves under grouped lyrics</label>
          <label><input type="checkbox" id="boxes" /> show label boxes</label>
        </div>

        <!-- warnings and errors from the engine -->
        <ul id="diag"></ul>
      </section>

      <!-- Right: the rendered page -->
      <section class="panel">
        <div class="bar">
          <span id="status">loading fonts…</span>
          <div class="buttons">
            <button id="dlSvg">SVG</button>
            <button id="dlPng">PNG</button>
            <button id="dlYolo">YOLO labels</button>
            <button id="dlJson">Bandish JSON</button>
          </div>
        </div>
        <div id="stage"></div>
        <div id="counts"></div>
        <div id="pick">Click a swar or syllable to see its matra, fraction and class.</div>
      </section>
    </main>

    <!-- The engine (built by `npm run build:web`), then the page logic -->
    <script src="bhatkhande-flow.js"></script>
    <script src="playground-settings.js"></script>
    <script src="playground-render.js"></script>
    <script src="playground-downloads.js"></script>
    <script src="playground.js"></script>
  </body>
</html>
