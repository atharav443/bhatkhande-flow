# Runs on every push and pull request: install, typecheck, format check, tests, build, package check,
# then the browser test of the playground in headless Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node 22
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # also runs `prepare`, which builds dist/
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Engine tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

  browser:
    name: Playground in Chromium
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run test:browser
